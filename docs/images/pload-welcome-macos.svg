<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">pload macOS welcome screen</title>
  <desc id="desc">A macOS-style terminal showing the pload installation welcome screen.</desc>
  <defs>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#262b36"/><stop offset="1" stop-color="#1d212a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#10131a"/>
  <rect x="70" y="48" width="1300" height="804" rx="18" fill="#171a21" filter="url(#shadow)"/>
  <rect x="70" y="48" width="1300" height="58" rx="18" fill="url(#bar)"/>
  <rect x="70" y="88" width="1300" height="18" fill="url(#bar)"/>
  <circle cx="104" cy="77" r="9" fill="#ff5f57"/><circle cx="136" cy="77" r="9" fill="#febc2e"/><circle cx="168" cy="77" r="9" fill="#28c840"/>
  <text x="720" y="83" text-anchor="middle" fill="#b7bdc9" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="18">tibless — zsh — 120×38</text>
  <g font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="22">
    <text x="112" y="150" fill="#91a7ff">$</text><text x="138" y="150" fill="#e7eaf0">python -m pload.installer</text>
    <text x="112" y="193" fill="#72d6a5">[*]</text><text x="165" y="193" fill="#e7eaf0">Installed pload 0.8.7: /Users/tibless/.local/bin/pload</text>
    <text x="112" y="225" fill="#72d6a5">[*]</text><text x="165" y="225" fill="#e7eaf0">Configuration: /Users/tibless/.pload/config.json</text>
    <text x="112" y="257" fill="#72d6a5">[*]</text><text x="165" y="257" fill="#e7eaf0">Updated shell profile: /Users/tibless/.zshrc</text>
    <text x="112" y="315" fill="#73d7ff">   ____  _                 _</text>
    <text x="112" y="343" fill="#73d7ff">  |  _ \| | ___   __ _  __| |</text>
    <text x="112" y="371" fill="#73d7ff">  | |_) | |/ _ \ / _` |/ _` |</text>
    <text x="112" y="399" fill="#73d7ff">  |  __/| | (_) | (_| | (_| |</text>
    <text x="112" y="427" fill="#73d7ff">  |_|   |_|\___/ \__,_|\__,_|</text>
    <text x="112" y="475" fill="#ffffff" font-weight="700">  pload 0.8.7 is ready</text>
    <text x="112" y="509" fill="#c7cbd4">  Your private runtime and launcher are installed.</text>
    <text x="112" y="560" fill="#ffffff" font-weight="700">  Next steps</text>
    <text x="112" y="596" fill="#72d6a5">  1</text><text x="150" y="596" fill="#e7eaf0"> Check configuration:  pload cfg</text>
    <text x="112" y="628" fill="#72d6a5">  2</text><text x="150" y="628" fill="#e7eaf0"> Find Python versions:  pload python list</text>
    <text x="112" y="660" fill="#72d6a5">  3</text><text x="150" y="660" fill="#e7eaf0"> Create an environment: pload new -n data -v 3.12</text>
    <text x="112" y="692" fill="#72d6a5">  4</text><text x="150" y="692" fill="#e7eaf0"> Read the walkthrough:  pload -h -d</text>
    <text x="112" y="748" fill="#ffffff" font-weight="700">  Installed paths</text>
    <text x="112" y="782" fill="#c7cbd4">  launcher   /Users/tibless/.local/bin/pload</text>
    <text x="112" y="814" fill="#c7cbd4">  data       /Users/tibless/.pload</text>
    <text x="112" y="846" fill="#91a7ff">$</text><text x="138" y="846" fill="#e7eaf0">pload new -n data -v 3.12</text>
  </g>
</svg>
